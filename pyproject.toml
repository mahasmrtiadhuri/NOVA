[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "nova-continual-learning"
version = "0.4.0"
description = "Continual learning benchmarks with compute-aware experimentation"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["torch>=2.2,<3"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
nova = "nova.cli:main"

[tool.setuptools.packages.find]
include = ["nova*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
