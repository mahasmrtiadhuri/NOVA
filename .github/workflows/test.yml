name: Tests
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install CPU dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -e '.[dev]' --no-deps
          python -m pip install pytest
      - name: Run tests
        run: python -m pytest
      - name: Smoke rule generalization
        run: |
          python -m nova experiment --dataset rules --tasks 2 --entities 5 --values 3 \
            --steps 2 --d-model 32 --layers 1 --heads 4 --batch-size 4 --output runs/ci-rules
      - name: Smoke text learning
        run: |
          python -m nova experiment --dataset text --corpus examples/sample_text.txt \
            --tasks 2 --context-length 8 --steps 2 --d-model 32 \
            --layers 1 --heads 4 --batch-size 4 --output runs/ci-text
      - name: Smoke in-context mapping
        run: |
          python -m nova meta --steps 2 --symbols 4 --support-size 3 \
            --d-model 32 --layers 1 --heads 4 --batch-size 4 \
            --eval-episodes 20 --output runs/ci-meta
